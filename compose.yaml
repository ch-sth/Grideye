name: grideye
services:
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
    healthcheck: {test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grideye}
      POSTGRES_USER: ${POSTGRES_USER:-grideye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 10}
    restart: unless-stopped
  backend:
    build: .
    volumes: ["./config:/app/config"]
    command: ["uvicorn", "services.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app-env
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grideye}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-grideye}
      SERVICE_TIMEOUT_SECONDS: ${SERVICE_TIMEOUT_SECONDS:-15}
    ports: ["8000:8000"]
    depends_on:
      mqtt: {condition: service_healthy}
      database: {condition: service_healthy}
    restart: unless-stopped
  uwb-simulator:
    profiles: [legacy-simulation]
    build: .
    volumes: ["./config:/app/config:ro"]
    command: ["python", "-m", "simulation.uwb_simulator.main"]
    environment: *app-env
    depends_on: {mqtt: {condition: service_healthy}}
    restart: unless-stopped
  flight-simulator:
    profiles: [legacy-simulation]
    build: .
    volumes: ["./config:/app/config:ro"]
    command: ["python", "-m", "simulation.flight_simulator.main"]
    environment: *app-env
    depends_on: {mqtt: {condition: service_healthy}}
    restart: unless-stopped
  tracking:
    build: .
    volumes: ["./config:/app/config:ro"]
    command: ["python", "-m", "services.tracking.main"]
    environment: *app-env
    depends_on: {mqtt: {condition: service_healthy}}
    restart: unless-stopped
volumes:
  mqtt_data:
  postgres_data:
